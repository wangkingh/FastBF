; FastBF one-day vpn108 smoke/test configuration.
; This keeps the legacy default processing style but only selects the
; 2015-01-01 SAC timestamp for a quick server-side validation run.

[seisarray.1]
name = x2_20150101
sac_dir = /home/denglin/x2_5hz/respDONE/X2/2015
pattern = {home}/{*}/{*}.{station}.{*}.{component}.{YYYY}.{JJJ}.{suffix}
station_list = ../example/stations_center.txt
component_list = BHZ

[time_filter]
time_start = 2015-01-01 00:00:00
time_end = 2015-01-01 00:00:00
time_list = NONE

[quality_filter]
; Minimum valid station count for a timestamp.
min_stations = 10

[window]
; Window length in seconds.
win_len = 1800
; Window shift in seconds.
shift_len = 1800
; Optional 0-based base-window indices to skip. Use NONE to disable.
skip_step = NONE
; Window taper: tukey, hann, or none.
taper = tukey
; Tukey alpha used when taper = tukey.
taper_alpha = 0.05

[slowness_grid]
s_range = 12.0
s_res = 0.2

[bands]
; Single target frequency band in Hz. Run FastBF once per band for sweeps.
bands = 0.1/0.2

[beamforming]
; Keep the default validation path lightweight: one Capon stack product for
; the selected daily SAC timestamp.
backend = reference
method = capon
mode = stack
group_windows = 4

[device]
cpu_worker_num = 10
ids = 0
procs_per_gpu = 4
; gpu_mem_mb = 8192,8192

[output]
dir = /home/denglin/wjx_work/FastBF_260611/runs/default_20150101
