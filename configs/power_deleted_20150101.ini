; FastBF one-day vpn108 power/deleted test configuration.
; Same data, station list, window, band, and slowness grid as
; default_20150101.ini, but using the power backend's channel-deletion
; Bartlett product.

[seisarray.1]
name = x2_20150101_power_deleted
sac_dir = /home/denglin/x2_5hz/respDONE/X2/2015
pattern = {home}/{*}/{*}.{station}.{*}.{component}.{YYYY}.{JJJ}.{suffix}
station_list = ../example/stations_center.txt
component_list = BHZ

[time_filter]
time_start = 2015-01-01 00:00:00
time_end = 2015-01-01 00:00:00
time_list = NONE

[quality_filter]
min_stations = 10

[window]
win_len = 1800
shift_len = 1800
skip_step = NONE
taper = tukey
taper_alpha = 0.05

[slowness_grid]
s_range = 12.0
s_res = 0.2

[bands]
bands = 0.1/0.2

[beamforming]
backend = power
method = deleted
mode = stack
group_windows = 4

[device]
cpu_worker_num = 10
ids = 0
procs_per_gpu = 4
; gpu_mem_mb = 8192,8192

[output]
dir = /home/denglin/wjx_work/FastBF_260611/runs/power_deleted_20150101
