; configs/default.ini
; ---------- 1. ARRAY ----------
[array]
sac_dir = /home/wjx/bf_work/temp_data
pattern = {home}/{*}.{station}.{*}.{component}.{YYYY}.{JJJ}.{suffix}
time_start = 2000-09-01 00:00:00
time_end = 2017-09-30 01:00:00
time_list = NONE                                                         ; 留空 = 不用
station_list = NONE
component_list = BHZ

; ---------- 2. WINDOW ----------
[window]
; 窗长秒数
win_len = 1800
; 滑窗步长 = 0.5 × win_len (0=全重叠, 1=无重叠)
hop_ratio = 1
; 多少个 batch 叠加/平均后写一幅 FK
stack_size = 999
;跳过的时窗
skip_step = NONE
; 有效台站数门限
min_stations = 10

; ---------- 3. SLOWNESS_GRID ----------
[slowness_grid]
s_range = 7.0
s_res = 0.4

; ---------- 4. BANDS ----------
[bands]
; 写法 —— 多段频带 频率单位 Hz，f1<f2，所有值必须 >0
bands = 0.1/0.2

; ---------- 5. device ----------
[device]
cpu_num = 10
ids = 0,1
procs_per_gpu = 4
; gpu_mem_mb   = 8192,8192       ; 如需配额

; ---------- 6. OUTPUT ----------
[output]
dir = /home/wjx/bf_work/temp_output

; ---------- 7. LOGGING ----------
[logging]
level = INFO
file = NONE  ; 留空=自动生成
