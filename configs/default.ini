; FastBF default example.
; This file is intentionally small: one hour, one band, one component.

[seisarray.1]
name = x2
sac_dir = /home/denglin/x2_5hz/respDONE/X2/2015
pattern = {home}/{*}/{*}.{station}.{*}.{component}.{YYYY}.{JJJ}.{suffix}
station_list = NONE
component_list = BHZ

[time_filter]
time_start = 2015-01-01 00:00:00
time_end = 2015-01-01 01:00:00
time_list = NONE

[quality_filter]
; Minimum valid station count for a timestamp.
min_stations = 10

[window]
; Window length in seconds.
win_len = 1800
; Window shift in seconds.
shift_len = 1800
; Optional time-window skipping rule. Use NONE to disable.
skip_step = NONE

[slowness_grid]
s_range = 12.0
s_res = 0.2

[bands]
; Single target frequency band in Hz. Run FastBF once per band for sweeps.
bands = 0.1/0.2

[beamforming]
; method: capon, bartlett, or both.
method = capon
; mode:
;   stack   = one BF result per SAC timestamp/list
;   grouped = one BF result per group_windows base windows
;   window  = one BF result per base window
mode = stack
; Example: win_len=1800 and group_windows=4 -> one result every 2 hours.
; Used only when mode = grouped.
group_windows = 4

[device]
cpu_worker_num = 10
ids = 0,1
procs_per_gpu = 4
; gpu_mem_mb = 8192,8192

[output]
dir = /home/denglin/wjx_work/bf_x2_test_2
