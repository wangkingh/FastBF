; FastBF server example.

[seisarray.1]
name = server_array
sac_dir = /home/denglin/bf_work/temp_data
pattern = {home}/{*}.{station}.{*}.{component}.{YYYY}.{JJJ}.{suffix}
station_list = NONE
component_list = BHZ

[time_filter]
time_start = 2000-09-01 00:00:00
time_end = 2017-09-30 01:00:00
time_list = NONE

[quality_filter]
min_stations = 10

[window]
win_len = 1800
shift_len = 1800
skip_step = NONE
taper = tukey
taper_alpha = 0.05

[slowness_grid]
s_range = 12.0
s_res = 0.2

[bands]
; Single target frequency band in Hz. Run FastBF once per band for sweeps.
bands = 0.1/0.2

[beamforming]
backend = reference
method = capon
mode = stack
group_windows = 4

[device]
cpu_worker_num = 10
ids = 0,1
procs_per_gpu = 4
; gpu_mem_mb = 8192,8192

[output]
dir = /home/denglin/bf_work/temp_output
