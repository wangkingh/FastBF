; FastBF self-contained synthetic example.
; Data are generated by make_synthetic_sac.py under example/data/.

[seisarray.1]
name = synthetic_array
sac_dir = data
pattern = {home}/{network}.{station}.{locid}.{component}.{YYYY}.{JJJ}.{suffix}
station_list = NONE
component_list = BHZ

[time_filter]
time_start = 2020-01-01 00:00:00
time_end = 2020-01-01 00:00:00
time_list = NONE

[quality_filter]
min_stations = 8

[window]
win_len = 600
shift_len = 600
skip_step = NONE

[slowness_grid]
s_range = 4.0
s_res = 0.2

[bands]
bands = 0.15/0.35

[beamforming]
method = both
mode = stack
group_windows = 0

[device]
cpu_worker_num = 2
ids = 0
procs_per_gpu = 1

[output]
dir = workspace
