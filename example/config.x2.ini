; FastBF real-data example using the uploaded X2 2015 day-001 fixture.
; The station list selects the central 217-station subset; 208 stations are
; present in the uploaded SAC directory.

[seisarray.1]
name = x2_center
sac_dir = X2_2015_01
pattern = {home}/{network}.{station}.{locid}.{component}.{YYYY}.{JJJ}.{suffix}
station_list = stations_center.txt
component_list = BHZ

[time_filter]
time_start = 2015-01-01 00:00:00
time_end = 2015-01-01 00:00:00
time_list = NONE

[quality_filter]
min_stations = 200

[window]
win_len = 1800
shift_len = 1800
skip_step = NONE
taper = tukey
taper_alpha = 0.05

[slowness_grid]
s_range = 12.0
s_res = 0.2

[bands]
bands = 0.1/0.2

[beamforming]
backend = reference
method = both
mode = stack
group_windows = 0

[device]
cpu_worker_num = 10
ids = 0
procs_per_gpu = 1

[output]
dir = x2_workspace
