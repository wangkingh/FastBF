[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastbf"
version = "0.1.0"
description = "CUDA native beamforming pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
]

[project.scripts]
fastbf = "caponlib.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["caponlib*"]

[tool.setuptools.package-data]
caponlib = [
  "template.ini",
  "bin/*",
  "bin/*/*",
]
