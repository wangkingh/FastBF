; FastBF starter configuration.
; Edit the array paths, pattern, time filter, GPU ids, and output directory.

[seisarray.1]
name = array1
sac_dir = /path/to/sac/root
pattern = {home}/{*}/{*}.{station}.{*}.{component}.{YYYY}.{JJJ}.{suffix}
station_list = NONE
component_list = BHZ

[time_filter]
time_start = 2015-01-01 00:00:00
time_end = 2015-01-01 01:00:00
time_list = NONE

[quality_filter]
min_stations = 10

[window]
win_len = 1800
shift_len = 1800
skip_step = NONE
taper = tukey
taper_alpha = 0.05

[slowness_grid]
s_range = 12.0
s_res = 0.2

[bands]
; Single target frequency band in Hz. Run FastBF once per band for sweeps.
bands = 0.1/0.2

[beamforming]
; backend: reference or power
; reference = Capon + channel-equalized Bartlett
; power = raw Bartlett + channel-deletion Bartlett
backend = reference
; method:
;   reference backend: capon, bartlett, or both
;   power backend: raw, deleted, or both
method = capon
; mode: stack, grouped, or window
mode = stack
; Used only when mode = grouped. Example:
; win_len=1800 and group_windows=4 -> one result every 2 hours.
group_windows = 4

[device]
cpu_worker_num = 10
ids = 0
procs_per_gpu = 1

[output]
dir = ./fastbf_output
